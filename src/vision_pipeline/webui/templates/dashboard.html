<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera + Terminal Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/@xterm/xterm@5/css/xterm.css">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #ddd;
    --term-bg: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --panel: #21242b;
      --text: #eaeaea;
      --muted: #9aa0a6;
      --border: #333;
      --term-bg: #0d0f13;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 0.6rem 1.25rem;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  header h1 { font-size: 1.05rem; margin: 0; }
  header .status { font-size: 0.78rem; color: var(--muted); margin-top: 0.1rem; }
  main {
    display: flex;
    flex: 1;
    min-height: 0;
    gap: 1rem;
    padding: 1rem;
  }
  .camera-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem;
    flex: 1 1 45%;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .camera-panel img {
    width: 100%;
    flex: 1;
    object-fit: contain;
    display: block;
    border-radius: 6px;
    background: #000;
    min-height: 0;
  }
  .terminal-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem;
    flex: 1 1 55%;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .terminal-panel .panel-title {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 0.5rem;
    font-family: ui-monospace, monospace;
  }
  #terminal {
    flex: 1;
    min-height: 0;
    background: var(--term-bg);
    border-radius: 6px;
    padding: 4px;
  }
</style>
</head>
<body>
<header>
  <h1>Camera + Terminal Dashboard</h1>
  <div class="status" id="conn-status">connecting…</div>
</header>
<main>
  <section class="camera-panel">
    <img src="/video_feed" alt="live camera feed">
  </section>
  <section class="terminal-panel">
    <div class="panel-title">{{ shell }} — click to focus, keys go straight to the shell</div>
    <div id="terminal"></div>
  </section>
</main>

<script src="https://unpkg.com/@xterm/xterm@5/lib/xterm.js"></script>
<script src="https://unpkg.com/@xterm/addon-fit@0.10/lib/addon-fit.js"></script>
<script>
const statusEl = document.getElementById("conn-status");

const term = new Terminal({
  convertEol: true,
  cursorBlink: true,
  fontFamily: "ui-monospace, Consolas, monospace",
  fontSize: 13,
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById("terminal"));
fitAddon.fit();
term.focus();

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// Every keystroke (including escape sequences for arrows, Ctrl-C, etc.) goes
// straight to the pty, same as any other terminal emulator.
term.onData((data) => {
  fetch("/terminal/input", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ data }),
  }).catch(() => {});
});

term.onResize(({ cols, rows }) => {
  fetch("/terminal/resize", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ cols, rows }),
  }).catch(() => {});
});

window.addEventListener("resize", () => fitAddon.fit());

function connectStream() {
  const es = new EventSource("/terminal/stream");
  es.onopen = () => { statusEl.textContent = "connected"; };
  es.onmessage = (ev) => {
    term.write(b64ToBytes(ev.data));
  };
  es.onerror = () => {
    statusEl.textContent = "disconnected — retrying…";
  };
}

connectStream();
// Push our actual terminal size to the pty once the layout has settled.
setTimeout(() => fitAddon.fit(), 200);
</script>
</body>
</html>
